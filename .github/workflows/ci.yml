name: CI

on:
  pull_request:
  push:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "agents-datum.md"
  release:
    types: [ "published" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CACHE: ~/.npm

jobs:
  # ─── Install ────────────────────────────────────────────────
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26.12.1 }
      - uses: actions/cache@v6
        id: cache-deps
        with:
          path: |
            ${{ env.NPM_CACHE }}
            **/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/package-lock.json', '**/package.json', '.npmrc') }}
      - if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

  # ─── Quality ────────────────────────────────────────────────
  lint:
    name: Lint & Format
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26.12.1 }
      - uses: actions/cache@v6
        with:
          path: |
            ${{ env.NPM_CACHE }}
            **/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/package-lock.json', '**/package.json', '.npmrc') }}
      - run: npm run lint && npm run format:check

  typecheck:
    name: Type Check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26.12.1 }
      - uses: actions/cache@v6
        with:
          path: |
            ${{ env.NPM_CACHE }}
            **/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/package-lock.json', '**/package.json', '.npmrc') }}
      - run: npm run typecheck

  build:
    name: Build
    needs: [ lint, typecheck ]
    runs-on: ubuntu-latest
    if: ${{ !failure() && !cancelled() }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26.12.1 }
      - uses: actions/cache@v6
        with:
          path: |
            ${{ env.NPM_CACHE }}
            **/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/package-lock.json', '**/package.json', '.npmrc') }}
      - run: npm run build
      - run: bin/smoke-start
      - run: bin/deploy-url-test

  # ─── Status Gate ────────────────────────────────────────────
  status-check:
    name: Final Status Check
    needs: [ install, lint, typecheck, build ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Workflow Status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️ One or more jobs were cancelled"
            exit 1
          else
            echo "✅ All jobs passed"
          fi
