pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{js,jsx,ts,tsx}'
      run: npx --no-install eslint {staged_files} --fix
      stage_fixed: true
    prettier:
      glob: '*.{js,jsx,ts,tsx,json,css,md}'
      run: npx --no-install prettier --write {staged_files}
      stage_fixed: true
    typecheck:
      glob: '*.{ts,tsx}'
      run: npx --no-install tsc --noEmit
      stage_fixed: false
